spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: identity-auth
          uri: ${IDENTITY_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=2
        - id: job-executions
          uri: ${EXECUTION_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/jobs/{jobId}/executions
          order: -10
          filters:
            - RewritePath=/api/v1/jobs/(?<jobId>[^/]+)/executions, /executions?jobId=$\{jobId}
        - id: jobs
          uri: ${JOB_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/jobs/**
          filters:
            - RewritePath=/api/v1/jobs(?<seg>/?.*), /jobs${seg}
        - id: executions
          uri: ${EXECUTION_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/executions/**
          filters:
            - RewritePath=/api/v1/executions(?<seg>/?.*), /executions${seg}
        - id: notifications
          uri: ${NOTIFICATION_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - RewritePath=/api/v1/notifications(?<seg>/?.*), /notifications${seg}

server:
  port: ${GATEWAY_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

chronos:
  security:
    jwt:
      secret: ${CHRONOS_JWT_SECRET:change-me-please-this-is-a-development-only-secret-32+}
      issuer: chronos-identity
      ttl-seconds: 3600

logging:
  pattern:
    level: "%5p [corr=%X{correlationId:-}]"
