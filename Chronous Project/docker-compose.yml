name: chronos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos
      POSTGRES_DB: postgres
    volumes:
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
      - chronos-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  identity-service:
    build:
      context: ./identity-service
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/identity_db
      IDENTITY_DB_USER: chronos
      IDENTITY_DB_PASSWORD: chronos
      CHRONOS_JWT_SECRET: ${CHRONOS_JWT_SECRET:-change-me-please-this-is-a-development-only-secret-32+}
    ports:
      - "8081:8081"

  job-service:
    build:
      context: ./job-service
    depends_on:
      postgres: {condition: service_healthy}
      kafka:    {condition: service_healthy}
    environment:
      JOB_DB_URL: jdbc:postgresql://postgres:5432/job_db
      JOB_DB_USER: chronos
      JOB_DB_PASSWORD: chronos
      KAFKA_BOOTSTRAP: kafka:9092
      CHRONOS_JWT_SECRET: ${CHRONOS_JWT_SECRET:-change-me-please-this-is-a-development-only-secret-32+}
    ports:
      - "8082:8082"

  scheduler-service:
    build:
      context: ./scheduler-service
    depends_on:
      postgres: {condition: service_healthy}
      kafka:    {condition: service_healthy}
    environment:
      SCHEDULER_DB_URL: jdbc:postgresql://postgres:5432/scheduler_db
      SCHEDULER_DB_USER: chronos
      SCHEDULER_DB_PASSWORD: chronos
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8083:8083"

  execution-service:
    build:
      context: ./execution-service
    depends_on:
      postgres: {condition: service_healthy}
      kafka:    {condition: service_healthy}
    environment:
      EXECUTION_DB_URL: jdbc:postgresql://postgres:5432/execution_db
      EXECUTION_DB_USER: chronos
      EXECUTION_DB_PASSWORD: chronos
      KAFKA_BOOTSTRAP: kafka:9092
      CHRONOS_JWT_SECRET: ${CHRONOS_JWT_SECRET:-change-me-please-this-is-a-development-only-secret-32+}
    ports:
      - "8084:8084"

  notification-service:
    build:
      context: ./notification-service
    depends_on:
      postgres: {condition: service_healthy}
      kafka:    {condition: service_healthy}
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_db
      NOTIFICATION_DB_USER: chronos
      NOTIFICATION_DB_PASSWORD: chronos
      KAFKA_BOOTSTRAP: kafka:9092
      CHRONOS_JWT_SECRET: ${CHRONOS_JWT_SECRET:-change-me-please-this-is-a-development-only-secret-32+}
    ports:
      - "8085:8085"

  api-gateway:
    build:
      context: ./api-gateway
    depends_on:
      - identity-service
      - job-service
      - execution-service
      - notification-service
    environment:
      IDENTITY_URL:     http://identity-service:8081
      JOB_URL:          http://job-service:8082
      EXECUTION_URL:    http://execution-service:8084
      NOTIFICATION_URL: http://notification-service:8085
      CHRONOS_JWT_SECRET: ${CHRONOS_JWT_SECRET:-change-me-please-this-is-a-development-only-secret-32+}
    ports:
      - "8080:8080"

volumes:
  chronos-pg-data:
